      - labor/LAB-CLM-0004#what_would_unseat
  - id: wn-2
    text: "Evidencia de que las filas de totales nacionales usadas no son las publicadas por el productor de la fuente."
    maps_to:
      - labor/LAB-CLM-0002#what_would_unseat
      - labor/LAB-CLM-0004#what_would_unseat
  - id: wn-3
    text: "Una demostración de error en la recuperación o el hash del IPC admitido."
    maps_to:
      - labor/LAB-CLM-0004#what_would_unseat

disclosure:
  id: disclosure
  text: "La hipótesis quedó inscrita antes de que este repositorio tuviera datos de CGI o de IPC. La exposición previa registrada es indirecta."
  maps_to:
    - labor/LAB-HYP-0002#operational_definition
    - labor/LAB-HYP-0002#prior_data_exposure

