required_public_attribution_changes: >-
  Agregar a /sobre (src/pages/sobre.astro, textos en editorial/site/ui.yml) una sección corta
  titulada «Atribuciones y licencias» con este texto exacto:


  Atribuciones y licencias

  La Cuenta de generación del ingreso e insumo de mano de obra (CGI-IMO) es una publicación del
  Instituto Nacional de Estadística y Censos (INDEC), registrada en el corpus de ALETHEIA con
  licencia CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). ALETHEIA-WEB no
  redistribuye los datos crudos de CGI-IMO: muestra el nombre de la publicación, su procedencia y
  texto editorial propio sobre resultados de ALETHEIA-LABOR. Ese texto es una presentación propia y
  no implica aval ni participación del INDEC. En la medida en que ALETHEIA-WEB publique material
  adaptado de CGI-IMO, ese material adaptado queda sujeto a CC BY-SA 4.0, incluida la condición
  ShareAlike.

  Las demás fuentes mencionadas en este sitio no tienen licencia de redistribución registrada en el
  corpus. ALETHEIA-WEB no redistribuye sus datos crudos, no declara ni infiere una licencia o un
  permiso, y no implica aval de sus productores. Los nombres de publicación y de productor se
  muestran solo para identificar la procedencia. Cuando el corpus no registra un enlace verificable
  al publicador, el sitio lo indica.


  Requisitos mecánicos de G-LEG-02 que el texto debe cumplir: contiene «INDEC», «CGI-IMO», «CC BY-SA
  4.0» y la palabra «licencia»/«atribuciones»; el enlace oficial es
  https://creativecommons.org/licenses/by-sa/4.0/. La cota no cambia en esta fase.
