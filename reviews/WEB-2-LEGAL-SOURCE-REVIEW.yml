      publicaciones de terceros; conservar el scope y el estado epistémico de cada texto; el
      material adaptado de CGI-IMO queda cubierto por la atribución y la aclaración de ShareAlike de
      /sobre; un cambio de significado exige reauditoría (Editorial Contract §4.3). Esta revisión no
      aprueba los textos PENDING_AUTHOR_REVIEW.
